name: Windows verification and experimental release

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.80.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.80.0
          rustup target add x86_64-pc-windows-msvc

      - name: Normalize formatting for development builds
        if: startsWith(github.ref, 'refs/heads/codex/')
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release executables
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Verify PE outputs and runtime imports
        shell: pwsh
        run: |
          $paths = @(
            "target\x86_64-pc-windows-msvc\release\usb-ejector.exe",
            "target\x86_64-pc-windows-msvc\release\usb-ejector-gui.exe"
          )
          foreach ($path in $paths) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing expected executable: $path"
            }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "Expected a PE executable with an MZ header: $path"
            }
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw "Could not locate dumpbin.exe"
          }

          foreach ($path in $paths) {
            $imports = (& $dumpbin /DEPENDENTS $path | Out-String)
            Write-Host $imports
            if ($imports -match '(?i)(vcruntime|msvcp|ucrtbase|api-ms-win-crt)') {
              throw "Unexpected separately distributed runtime import in $path"
            }
          }

      - name: Package portable test executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable -Force | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\usb-ejector-gui.exe portable\USB-Disk-Ejector-zh-CN.exe
          Copy-Item target\x86_64-pc-windows-msvc\release\usb-ejector.exe portable\usb-ejector-cli.exe
          Copy-Item EXPERIMENTAL-BUILD.txt portable\EXPERIMENTAL-BUILD.txt
          git diff --binary --output=portable/formatting.patch
          Compress-Archive -Path src,tests,Cargo.toml,Cargo.lock,build.rs,app.manifest,.cargo,.github,LICENSE,EXPERIMENTAL-BUILD.txt,THIRD_PARTY.md -DestinationPath portable\source.zip
          $env:GITHUB_SHA | Set-Content portable\SOURCE-COMMIT.txt -Encoding utf8
          Get-ChildItem portable\*.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content portable\SHA256SUMS.txt -Encoding utf8

      - name: Upload portable test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: usb-windows-x64-zh-cn
          path: portable/
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.80.0 --profile minimal
          rustup default 1.80.0
          rustup target add x86_64-pc-windows-msvc

      - name: Build portable GUI executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin usb-ejector-gui

      - name: Prepare release asset and notes
        id: asset
        shell: pwsh
        run: |
          $source = "target\x86_64-pc-windows-msvc\release\usb-ejector-gui.exe"
          $asset = "USB-Disk-Ejector-windows-x64-experimental.exe"
          Copy-Item $source $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $asset).Length

          @"
          ## Experimental portable GUI build

          Download **$asset** directly from this release. It is a single portable
          Windows x64 GUI executable; no installer or separately installed Visual
          C++ runtime is required. Static import checks cover the Windows system
          dependencies used by the executable.

          - Size: **$size bytes**
          - SHA-256: ``$hash``
          - Source commit: ``$env:GITHUB_SHA``

          ### Important safety notice

          This is an **unsigned experimental prerelease**, not a stable release.
          It has **not** been exercised end-to-end on Windows with physical USB
          media. Windows SmartScreen or publisher warnings may appear. Save open
          work and test only with disposable media.

          The tool is fail-closed and does not force-unmount, terminate programs,
          elevate, install a service, modify the registry, or remain resident.
          Windows inventory and removal calls are not atomic, so residual
          time-of-check/time-of-use risk remains.

          License: GPL-2.0-or-later. Corresponding source is this tagged commit.
          "@ | Set-Content release-notes.md -Encoding utf8

          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Publish experimental prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "${{ steps.asset.outputs.asset }}" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "USB Disk Ejector $env:GITHUB_REF_NAME (experimental)" `
            --notes-file release-notes.md `
            --prerelease
